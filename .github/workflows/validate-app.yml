name: Validate Sports Card Database

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check inline JavaScript syntax
        run: python scripts/check-inline-js.py index.html
      - name: Check critical workflow invariants
        run: python scripts/check-workflows.py
      - name: Test automatic AI catalog reconciliation
        run: node scripts/test-ai-catalog-match.js
      - name: Test exact AI shared-card set identity
        run: node scripts/test-ai-shared-set-identity.js
      - name: Test pricing cache eligibility\n        run: node scripts/test-pricing-cache.js\n      - name: Set up Deno for Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Function TypeScript
        run: |
          deno check supabase/functions/create-identified-card/index.ts
          deno check supabase/functions/refresh-card-price/index.ts
